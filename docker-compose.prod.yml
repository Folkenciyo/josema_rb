# Production stack for Dokploy.
#
# Differences from the dev compose: no published host ports (Traefik reaches the
# services through the Docker network, and the host ports would clash with the other
# stacks on the server), secrets come from the environment, and the session cookie is
# marked Secure because Traefik terminates TLS.
#
# Only the frontend needs a domain: it proxies /api and /static to the backend over the
# internal network, so the whole app lives on a single origin.
#
# Service names are prefixed because Dokploy attaches every stack to the shared
# `dokploy-network`: a generic name like `backend` resolves to whichever project
# registered that alias first.

services:
  josema-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-josema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-josema_rb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-josema} -d ${POSTGRES_DB:-josema_rb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  josema-backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-josema}:${POSTGRES_PASSWORD}@josema-db:5432/${POSTGRES_DB:-josema_rb}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TRAINER_EMAIL: ${TRAINER_EMAIL:?TRAINER_EMAIL is required}
      TRAINER_PASSWORD: ${TRAINER_PASSWORD:?TRAINER_PASSWORD is required}
      COOKIE_SECURE: "true"
    volumes:
      # Trainer-uploaded exercise photos must survive rebuilds; the imported library
      # is baked into the image instead.
      - exercise_images:/app/app/static/exercise-images/custom
    depends_on:
      josema-db:
        condition: service_healthy
    restart: unless-stopped

  josema-frontend:
    build: ./frontend
    environment:
      # Read at request time by src/proxy.ts (never at build time).
      BACKEND_URL: http://josema-backend:8000
    expose:
      - "3000"
    depends_on:
      - josema-backend
    restart: unless-stopped

volumes:
  pgdata:
  exercise_images:
